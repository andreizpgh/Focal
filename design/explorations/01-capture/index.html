 if(screen==='library')app.innerHTML='<main class="screen library">'+header()+'<section class="capture-pane" aria-label="New recording"><div class="capture-label"><span class="eyebrow muted">New recording</span></div><div class="time" aria-label="Zero minutes, zero seconds">'+timerMarkup(0)+'</div>'+wave('idle')+'<button class="primary record-button" onclick="startRecording()"><span class="record-symbol" aria-hidden="true"></span>Record</button><p class="privacy">'+icons.lock+'Stored only on this device</p></section><section class="saved"><div class="section-heading"><h2>Recent notes</h2><span>'+notes.length+' notes</span></div>'+notes.map((n,i)=>'<button class="note" onclick="openNote('+i+')" aria-label="Open '+esc(n.title)+'"><div><div class="note-title">'+n.title+'</div><div class="note-meta">'+n.day+'</div></div><span class="note-duration">'+n.duration+'</span></button>').join('')+'</section><footer class="library-foot"><span>Offline by design</span><span class="small-mark" aria-hidden="true"><b></b><b></b><b></b></span></footer></main>';
 if(screen==='recording'){app.innerHTML='<main class="screen recording'+(paused?' paused':'')+'">'+header()+'<section class="capture-pane"><div class="capture-label"><span class="eyebrow"><i class="live-dot"></i><span id="capture-status">'+(paused?'Paused':'Recording')+'</span></span><span class="eyebrow muted" style="font-size:9px;letter-spacing:1px">New note</span></div><div class="time" id="timer" aria-live="off">'+timerMarkup(seconds)+'</div>'+wave()+'<div class="ruler" aria-hidden="true"><span>00:00</span><span>00:10</span><span>00:20</span></div><div class="recording-meta"><span>'+esc(languageName())+' speech</span><span>'+icons.check+'Audio saved</span></div><p class="live-caption"><span>Ready for review next.</span>Finish recording to open the transcript.</p></section><footer class="capture-bottom"><div class="action-row"><button class="secondary" id="pause-button" onclick="togglePause()">'+(paused?icons.play+'Resume':icons.pause+'Pause')+'</button><button class="primary" onclick="finishRecording()"><span class="stop-symbol" aria-hidden="true"></span>Finish</button></div><p class="safe">'+icons.lock+'Recording continues with the screen off.</p></footer></main>';clock=setInterval(()=>{if(!paused){seconds++;const el=$('#timer');if(el)el.innerHTML=timerMarkup(seconds);}},1000);}
 if(screen==='review'){const n=notes[selected];app.innerHTML='<main class="screen review">'+header(true)+'<div class="review-body"><div class="note-day">'+n.day+'</div><h1 class="review-title">'+n.title+'</h1><div class="review-meta">'+n.duration+' &nbsp;·&nbsp; '+esc(languageName(n.language||'en'))+' &nbsp;·&nbsp; Saved on this device</div><section class="audio-player" aria-label="Original recording"><button class="play-button" id="play-button" aria-label="Play synthetic audio sample" onclick="togglePlayback()">'+icons.play+'</button><div class="audio-track" role="slider" tabindex="0" aria-label="Audio position" aria-valuemin="0" aria-valuemax="'+n.seconds+'" aria-valuenow="0" onclick="seekAudio(event)" onkeydown="seekKey(event)">'+wave()+'<div class="audio-times"><span id="audio-time">00:00</span><span>'+n.duration+'</span></div></div></section><div class="transcript-heading"><span class="eyebrow">Transcript</span><span class="review-count" id="review-count">'+(reviewed?'Reviewed':'1 phrase to review')+'</span></div><p class="transcript">Keep the first version focused on capture, review and sharing. The recording should stay safe when the <button class="uncertain'+(reviewed?' checked':'')+'" aria-label="Listen to or edit uncertain phrase: '+esc(phrase)+'" onclick="openPhrase()">'+esc(phrase)+'</button>.</p><p class="review-hint">'+icons.ear+(reviewed?'Tap the phrase to listen or edit.':'Tap the underlined phrase to listen or edit.')+'</p></div><footer class="review-footer"><button class="primary" id="copy-button" onclick="copyTranscript()">'+icons.copy+'Copy transcript</button><p>Your original audio is always kept.</p></footer></main>';}
}
function go(next){screen=next;const url=new URL(location.href);url.searchParams.set('screen',next);history.replaceState({},'',url);render();}
function startRecording(){seconds=0;paused=false;go('recording');}
function togglePause(){paused=!paused;$('.recording').classList.toggle('paused',paused);$('#capture-status').textContent=paused?'Paused':'Recording';$('#pause-button').innerHTML=paused?icons.play+'Resume':icons.pause+'Pause';$('#pause-button').setAttribute('aria-label',paused?'Resume recording':'Pause recording');}
function finishRecording(){notes.unshift({title:'New recording',day:'Today',duration:Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0'),seconds,language,phrase:'screen is off',reviewed:false});selected=0;playTime=0;phrase='screen is off';reviewed=false;go('review');}
function openNote(i){selected=i;playTime=0;phrase=notes[i].phrase||'screen is off';reviewed=notes[i].reviewed||false;go('review');}
function closeSheet(){portal.innerHTML='';}
function sheet(content){portal.innerHTML='<div class="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-handle" aria-hidden="true"></div>'+content+'</section></div>';setTimeout(()=>{const first=portal.querySelector('button');if(first)first.focus({preventScroll:true})},20);}
function openLanguages(){if(screen==='recording'){toast('Speech language is set for this recording. Finish to change it.');return;}sheet('<div class="sheet-head"><h2>Speech language</h2><button class="close" aria-label="Close language selection" onclick="closeSheet()">'+icons.close+'</button></div><p class="sheet-description">Choose the language you’ll be speaking.</p>'+languages.map(l=>'<button class="language-option '+(language===l[0]?'selected':'')+'" onclick="chooseLanguage(\''+l[0]+'\')"><span>'+l[1]+'</span><span>'+(language===l[0]?icons.check:l[0].toUpperCase())+'</span></button>').join(''));}
function chooseLanguage(code){language=code;render();}
function transcript(){return 'Keep the first version focused on capture, review and sharing. The recording should stay safe when the '+phrase+'.';}
function openPhrase(){stopPlayback();sheet('<div class="sheet-head"><h2>Check this phrase</h2><button class="close" aria-label="Close phrase editor" onclick="closeSheet()">'+icons.close+'</button></div><p class="sheet-description">Listen to the original, then edit if needed.</p><div class="phrase-time"><span>'+time(Math.max(0,notes[selected].seconds-4))+'–'+time(notes[selected].seconds)+'</span><button class="listen" id="listen-phrase" onclick="listenPhrase()">'+icons.play+'Listen</button></div><input id="phrase-field" class="edit-field" aria-label="Edit uncertain phrase" value="'+esc(phrase)+'"><button class="primary save" onclick="savePhrase()">Save phrase'+icons.check+'</button>');}
function savePhrase(){const next=$('#phrase-field').value.trim().replace(/[.]+$/,'');if(!next){$('#phrase-field').focus();return;}phrase=next;reviewed=true;notes[selected].phrase=next;notes[selected].reviewed=true;render();toast('Phrase saved');}
async function copyTranscript(){const value=transcript();try{if(!navigator.clipboard||!window.isSecureContext)throw Error('unavailable');await navigator.clipboard.writeText(value);$('#copy-button').innerHTML=icons.check+'Copied';toast('Transcript copied');setTimeout(()=>{const b=$('#copy-button');if(b)b.innerHTML=icons.copy+'Copy transcript';},2200);}catch(e){sheet('<div class="sheet-head"><h2>Copy transcript</h2><button class="close" aria-label="Close copy dialog" onclick="closeSheet()">'+icons.close+'</button></div><p class="sheet-description">Select the text below and use your device’s Copy action.</p><textarea readonly class="copy-fallback" aria-label="Transcript to copy">'+esc(value)+'</textarea><p class="copy-instruction">Clipboard access isn’t available in this preview.</p>');const field=$('.copy-fallback');field.focus();field.select();}}
function toast(message){clearTimeout(toastTimer);const old=$('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=message;document.body.append(t);toastTimer=setTimeout(()=>t.remove(),3600);}
function stopSpeech(){if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null;}}
function say(text,onEnd){stopSpeech();const audio=text==='screen is off'?phraseAudio:sampleAudio;activeAudio=audio;audio.currentTime=audio===sampleAudio&&Number.isFinite(audio.duration)?playTime/Math.max(1,notes[selected].seconds)*audio.duration:0;audio.onended=()=>{if(audio===sampleAudio){playTime=notes[selected].seconds;updateAudio();}activeAudio=null;if(onEnd)onEnd();};audio.onerror=()=>{toast('Audio preview could not play.');activeAudio=null;if(onEnd)onEnd();};audio.play().catch(()=>{toast('Audio preview could not play.');activeAudio=null;if(onEnd)onEnd();});return true;}
function listenPhrase(){const b=$('#listen-phrase');if(say('screen is off',()=>{if(b&&b.isConnected)b.innerHTML=icons.play+'Listen';})){b.innerHTML=icons.pause+'Listening';toast('Playing a synthetic speech sample');}}
function stopPlayback(){stopSpeech();clearInterval(playClock);playing=false;const b=$('#play-button');if(b){b.innerHTML=icons.play;b.setAttribute('aria-label','Play synthetic audio sample');}}
function togglePlayback(){if(playing){stopPlayback();return;}if(playTime>=notes[selected].seconds)playTime=0;if(say(transcript(),stopPlayback)){playing=true;$('#play-button').innerHTML=icons.pause;$('#play-button').setAttribute('aria-label','Pause audio');toast('Playing a synthetic speech sample');playClock=setInterval(()=>{if(Number.isFinite(sampleAudio.duration)&&sampleAudio.duration>0)playTime=Math.round(sampleAudio.currentTime/sampleAudio.duration*notes[selected].seconds);if(playing&&Number.isFinite(sampleAudio.duration))sampleAudio.currentTime=playTime/Math.max(1,notes[selected].seconds)*sampleAudio.duration;updateAudio();},1000);}}
function updateAudio(){const el=$('#audio-time');if(el)el.textContent=time(playTime);const track=$('.audio-track');if(track){track.setAttribute('aria-valuenow',playTime);track.querySelectorAll('i').forEach((b,i)=>b.style.background=i/66<=playTime/Math.max(1,notes[selected].seconds)?'var(--ink)':'#b5b9ae');}}
function seekAudio(event){const r=event.currentTarget.getBoundingClientRect();playTime=Math.round(Math.max(0,Math.min(1,(event.clientX-r.left)/r.width))*notes[selected].seconds);if(playing&&Number.isFinite(sampleAudio.duration))sampleAudio.currentTime=playTime/Math.max(1,notes[selected].seconds)*sampleAudio.duration;updateAudio();}
function seekKey(event){if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();playTime=Math.max(0,Math.min(notes[selected].seconds,playTime+(event.key==='ArrowRight'?5:-5)));if(playing&&Number.isFinite(sampleAudio.duration))sampleAudio.currentTime=playTime/Math.max(1,notes[selected].seconds)*sampleAudio.duration;updateAudio();}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
render();
</script>
</body>
</html>
