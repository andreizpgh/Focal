const svg=(name,extra='')=>`<svg viewBox="0 0 24 24" aria-hidden="true" ${extra}>${icons[name]||icons.arrow}</svg>`;

function render(){document.title=`focal — ${screen==='library'?'Library':screen==='recording'?'Recording':'Review'}`;app.innerHTML=screen==='recording'?recordingView():screen==='review'?reviewView():libraryView();if(screen==='recording')startRecordingTimer();}

function libraryNotes(){const found=notes.filter(n=>(n.title+' '+n.text).toLowerCase().includes(searchValue.toLowerCase()));if(!found.length)return '<div class="empty">No recordings found.<br>Try a title or a word from a transcript.</div>';const today=found.filter(n=>n.day==='Today'),older=found.filter(n=>n.day!=='Today');const feature=n=>`<article class="featured note-open" role="button" tabindex="0" aria-label="Open ${escapeHTML(n.title)}" onclick="openNote('${n.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openNote('${n.id}')}" ><div class="feature-top"><h2>${escapeHTML(n.title)}</h2>${svg('arrow')}</div><p class="excerpt">${escapeHTML(n.text.slice(0,76))}…</p><div class="feature-audio"><button class="mini-play" aria-label="Preview ${escapeHTML(n.title)} audio" onclick="event.stopPropagation();previewNote('${n.id}',this)">${svg('play')}</button><div class="waveform">${wave(1,38,7)}</div><span class="duration">${n.duration}</span></div><div class="featured-footer"><span>${languages.find(l=>l[0]===n.lang)[1]} · Transcript ready</span><span>Open to review</span></div></article>`;const olderHTML=older.length?`<div class="section-line shelf-label"><span class="eyebrow">YESTERDAY</span>${sortOldest?`<button onclick="toggleSort()" aria-label="Show most recent recordings first">Oldest first ${svg('sort')}</button>`:`<span class="eyebrow">${String(older.length).padStart(2,'0')}</span>`}</div><div class="shelf">${older.map((n,i)=>`<article class="shelf-note note-open" role="button" tabindex="0" aria-label="Open ${escapeHTML(n.title)}" onclick="openNote('${n.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openNote('${n.id}')}" ><h2>${escapeHTML(n.title)}</h2><div class="waveform">${wave(i+2,26,0)}</div><div class="shelf-meta"><span class="duration">${n.duration}</span>${svg('arrow')}</div></article>`).join('')}</div>`:'';return sortOldest?`${olderHTML}${today.length?'<div class="section-line" style="margi function filterNotes(value){searchValue=value;document.getElementById('library-content').innerHTML=libraryNotes();document.getElementById('clear-search').classList.toggle('hidden',!value)}
function clearSearch(){searchValue='';document.getElementById('search-input').value='';filterNotes('');document.getElementById('search-input').focus()}
function toggleSort(){sortOldest=!sortOldest;document.getElementById('library-content').innerHTML=libraryNotes();}
function openNote(id){selected=notes.find(n=>n.id===id);playhead=0;editing=false;go('review')}
function previewNote(id,button){if(playing){stopPlayback();document.querySelectorAll('.mini-play').forEach(b=>b.innerHTML=svg('play'));return;}playing=true;button.innerHTML=svg('pause');button.setAttribute('aria-label','Pause audio preview');let ticks=0;playTimer=setInterval(()=>{ticks++;const bars=button.nextElementSibling.children;Array.from(bars).forEach((bar,i)=>bar.classList.toggle('ink',i<Math.min(ticks,bars.length)));if(ticks>=10){stopPlayback();button.innerHTML=svg('play');button.setAttribute('aria-label','Preview audio');}},400)}
function recordingView(){return `<main class="screen recording-screen"><header class="topbar"><button class="back-link" onclick="leaveRecording()">${svg('back')}<span>Library</span></button><span class="wordmark">focal</span></header><div class="recording-title"><h1>New recording</h1><span class="language" style="border:0;padding-bottom:7px" aria-label="Recording speech language">${languages.find(l=>l[0]===language)[1]}</span></div><div class="capture-body"><div class="record-status" id="record-status"><i></i><span>Recording</span></div><div class="timer" id="record-timer">${format(recordingSeconds)}</div><div class="waveform capture-wave" id="capture-wave">${wave(3,57,57)}</div><div class="capture-save">${svg('shield')}<span id="save-state">Audio saved as you speak</span></div></div><footer class="capture-footer"><p class="capture-help">Keep speaking naturally.<br>Your transcript is prepared when you finish.</p><div class="transport-actions"><button class="secondary" id="pause-recording" onclick="togglePause()">${svg('pause')}Pause</button><button class="primary" onclick="finishRecording()">Finish${svg('arrow')}</button></div><p class="eyebrow">NO ACCOUNT · NO CLOUD</p></footer></main>`}
function startRecordingTimer(){clearInterval(recordingTimer);recordingTimer=setInterval(()=>{if(!recordingPaused){recordingSeconds++;const t=document.getElementById('record-timer');if(t)t.textContent=format(recordingSeconds)}},1000)}
function togglePause(){recordingPaused=!recordingPaused;document.getElementById('pause-recording').innerHTML=svg(recordingPaused?'play':'pause')+(recordingPaused?'Resume':'Pause');document.getElementById('record-status').classList.toggle('paused',recordingPaused);document.getElementById('record-status').querySelector('span').textContent=recordingPaused?'Paused':'Recording';document.getElementById('capture-wave').classList.toggle('paused-wave',recordingPaused);document.getElementById('save-state').textContent=recordingPaused?'Audio saved on this device':'Audio saved as you speak'}
function leaveRecording(){if(recordingSeconds===0){go('library');return}showModal(`<div class="sheet-handle"></div><div class="sheet-header"><h2>Keep this recording?</h2><button class="icon-button" aria-label="Close" onclick="closeModal()">${svg('close')}</button></div><p>Your audio is already saved. Finish to prepare the transcript, or return to recording.</p><button class="primary" style="margin-top:24px" onclick="finishRecording()">Finish and review${svg('arrow')}</button><button class="secondary" style="margin-top:10px;width:100%" onclick="closeModal()">Continue recording</button>`)}
function finishRecording(){clearInterval(recordingTimer);closeModal();app.insertAdjacentHTML('beforeend',`<div class="progress-overlay" role="status"><h2>Preparing your transcript</h2><p>Original audio saved on this device.</p><div class="progress-track"><i></i></div></div>`);const duration=Math.max(1,recordingSeconds);const captured={id:'capture-'+Date.now(),title:'New recording',day:'Today',duration:format(duration),seconds:duration,text:'Keep the first version focused on capture, review and sharing. The recording should stay safe when the screen is off.',lang:language,uncertain:true};notes.unshift(captured);setTimeout(()=>{selected=captured;playhead=0;editing=false;go('review')},1250)}
function languageSheet(){showModal(`<div class="sheet-handle"></div><div class="sheet-header"><h2>Speech language</h2><button class="icon-button" aria-label="Close" onclick="closeModal()">${svg('close')}</button></div><p>Choose the language you will speak.</p><div class="language-list">${languages.map(([code,name])=>`<button class="language-option" onclick="setLanguage('${code}')"><span>${name}</span><small>${code.toUpperCase()}</small>${code===language?svg('check'):'<span style="width:17px"></span>'}</button>`).join('')}</div>`)}
function setLanguage(code){language=code;closeModal();const b=document.querySelector('.language');if(b)b.textContent=languages.find(l=>l[0]===code)[1];const l=document.querySelector('.library-language');if(l)l.innerHTML=languages.find(l=>l[0]===code)[1]+svg('down')}
function transcriptHTML(){const text=escapeHTML(selected.text);return selected.uncertain?text.replace('screen is off',`<mark class="uncertain" role="button" tabindex="0" aria-label="Listen to and edit uncertain phrase: screen is off" onclick="phraseSheet()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();phraseSheet()}">screen is off</mark>`):text}
function reviewView(){return `<main class="screen review-screen">${topbar(true)}<div class="review-title"><h1>${escapeHTML(selected.title)}</h1><div class="metadata"><span>${selected.day}</span><b>·</b><span>${selected.duration}</span><b>·</b><button onclick="reviewLanguageSheet()" aria-label="Change transcript speech language">${languages.find(l=>l[0]===selected.lang)[1]}</button></div></div><div class="editor-toolbar"><span class="eyebrow">TRANSCRIPT</span><span class="eyebrow" style="font-size:9px;letter-spacing:1px">SAVED ON DEVICE</span></div><div class="transcript" id="transcript" role="textbox" aria-label="Transcript" aria-multiline="true" contenteditable="false">${transcriptHTML()}</div><button class="review-hint" id="review-hint" onclick="${selected.uncertain?'phraseSheet()':'showToast(\'Your changes are saved.\')'}"><span>${selected.uncertain?'1':'✓'}</span>${selected.uncertain?'Phrase to check · tap to listen and edit':'Transcript ready to copy'}</button><div class="review-spacer"></div><div class="audio-player"><button class="audio-play" id="audio-play" aria-label="Play original audio" onclick="togglePlayback()">${svg('play')}</button><div class="track"><div class="track-timeline"><span id="audio-time">0:00</span><span>${selected.duration}</span></div><div class="seek" role="slider" aria-label="Audio position" aria-valuemin="0" aria-valuemax="${selected.seconds}" aria-valuenow="0" tabindex="0" onclick="seek(event)" onkeydown="seekKeys(event)"><div class="seek-line"><div class="seek-progress" id="seek-progress"></div></div></div></div><button class="speed" id="speed" onclick="changeSpeed()" aria-label="Playback speed">${speed}×</button></div><div class="review-actions"><button class="primary" id="copy-button" onclick="copyTranscript()">${svg('copy')}Copy transcript</button><button class="export-button" onclick="exportTranscript()" aria-label="Export transcript as text file">${svg('export')}</button></div><p class="bottom-note">Original audio stays with this note.</p></main>`}
function reviewLanguageSheet(){showModal(`<div class="sheet-handle"></div><div class="sheet-header"><h2>Speech language</h2><button class="icon-button" aria-label="Close" onclick="closeModal()">${svg('close')}</button></div><p>This transcript was prepared in ${escapeHTML(languages.find(l=>l[0]===selected.lang)[1])}. Choose a language for your next recording.</p><div class="language-list">${languages.map(([code,name])=>`<button class="language-option" onclick="language='${code}';closeModal();showToast('${name} selected for your next recording.')"><span>${name}</span><small>${code.toUpperCase()}</small>${code===language?svg('check'):'<span style="width:17px"></span>'}</button>`).join('')}</div>`)}
function toggleEdit(){editing=!editing;const t=document.getElementById('transcript');if(editing){t.contentEditable='true';t.querySelectorAll('mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));t.focus();document.getElementById('edit-button').innerHTML=svg('check')+'<span>Done</span>';document.getElementById('review-hint').classList.add('hidden')}else{selected.text=t.innerText.trim();selected.uncertain=false;t.contentEditable='false';document.getElementById('edit-button').innerHTML=svg('edit')+'<span>Edit</span>';document.getElementById('review-hint').innerHTML='<span>✓</span>Changes saved';document.getElementById('review-hint').classList.remove('hidden');showToast('Transcript changes saved. Original audio preserved.')}}
function phraseSheet(){if(editing)return;stopPlayback();showModal(`<div class="sheet-handle"></div><div class="sheet-header"><h2>Check this phrase</h2><button class="icon-button" aria-label="Close" onclick="closeModal()">${svg('close')}</button></div><p>Listen to the original, then make any correction.</p><div class="phrase-source"><button class="secondary" id="phrase-play" onclick="playPhrase()">${svg('play')}Listen</button><div><div class="waveform">${wave(4,29,13)}</div><div class="phrase-time" id="phrase-time">0:08 — 0:12</div></div></div><label class="phrase-label" for="phrase-input">TRANSCRIPT</label><textarea class="phrase-input" id="phrase-input" rows="2">screen is off</textarea><button class="primary" onclick="savePhrase()">${svg('check')}Save correction</button>`)}
function playPhrase(){const b=document.getElementById('phrase-play');if(playing){stopPlayback();b.innerHTML=svg('play')+'Listen';return}playing=true;b.innerHTML=svg('pause')+'Pause';let t=8;playTimer=setInterval(()=>{t++;const l=document.getElementById('phrase-time');if(l)l.textContent=format(t)+' / 0:12';if(t>=12){stopPlayback();if(document.getElementById('phrase-play'))document.getElementById('phrase-play').innerHTML=svg('play')+'Listen again'}},1000)}
function savePhrase(){const value=document.getElementById('phrase-input').value.trim();if(!value){showToast('Enter a phrase before saving.');return}selected.text=selected.text.replace('screen is off',value);selected.uncertain=false;closeModal();render();showToast('Correction saved. Original audio preserved.')}
function togglePlayback(){if(playing){stopPlayback();return}if(playhead>=selected.seconds)playhead=0;playing=true;document.getElementById('audio-play').innerHTML=svg('pause');document.getElementById('audio-play').setAttribute('aria-label','Pause original audio');playTimer=setInterval(()=>{playhead+=.25*speed;if(playhead>=selected.seconds){playhead=selected.seconds;stopPlayback()}updatePlayer()},250)}
function stopPlayback(){clearInterval(playTimer);playing=false;const b=document.getElementById('audio-play');if(b){b.innerHTML=svg('play');b.setAttribute('aria-label','Play original audio')}}
function updatePlayer(){const t=document.getElementById('audio-time'),p=document.getElementById('seek-progress');if(t)t.textContent=format(playhead);if(p){p.style.width=(playhead/selected.seconds*100)+'%';p.closest('[role=slider]').setAttribute('aria-valuenow',Math.floor(playhead))}}
function seek(e){const r=e.currentTarget.getBoundingClientRect();playhead=Math.max(0,Math.min(selected.seconds,(e.clientX-r.left)/r.width*selected.seconds));updatePlayer()}
function seekKeys(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();playhead=Math.max(0,Math.min(selected.seconds,playhead+(e.key==='ArrowRight'?5:-5)));updatePlayer()}}
function changeSpeed(){speed=speed===1?1.5:speed===1.5?2:1;document.getElementById('speed').textContent=speed+'×'}
function currentText(){const t=document.getElementById('transcript');return t?t.innerText.trim():selected.text}
async function copyTranscript(){const value=currentText();try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(value);showToast('Transcript copied.')}catch(e){showToast('Clipboard unavailable here. Use Export to save a text file.')}}
function exportTranscript(){const blob=new Blob([selected.title+'\n\n'+currentText()+'\n'],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=selected.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Text file prepared for download.')}
function showModal(html){previousFocus=document.activeElement;modal.innerHTML=`<div class="overlay" role="presentation" onclick="if(event.target===this)closeModal()"><section class="sheet" role="dialog" aria-modal="true" aria-label="${html.includes('Speech language')?'Speech language':html.includes('Keep this recording')?'Keep this recording':'Check this phrase'}">${html}</section></div>`;const b=modal.querySelector('button');if(b)b.focus()}
function closeModal(){stopPlayback();modal.innerHTML='';if(previousFocus&&previousFocus.isConnected)previousFocus.focus()}
function showToast(text){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');toastTimer=setTimeout(()=>el.classList.add('hidden'),3400)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.innerHTML)closeModal();if(e.key==='Tab'&&modal.innerHTML){const focusables=[...modal.querySelectorAll('button,textarea,input,[tabindex="0"]')];const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('popstate',()=>{stopPlayback();clearInterval(recordingTimer);closeModal();screen=new URLSearchParams(location.search).get('screen')||'library';render()});
if(!['library','recording','review'].includes(screen))screen='library';render();
</script>
