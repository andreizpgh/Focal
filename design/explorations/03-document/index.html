function waveform(count=43){return Array.from({length:count},(_,i)=>`<i style="height:${[6,12,8,18,25,16,11,21,15,8,13,23,17,9,26,19,11,16,23,13,7,17,25,13,8,19,15,10,24,18,7,13,22,16,10,19,25,12,8,18,14,9,20][i%43]}px;animation-delay:${-(i%9)*.17}s"></i>`).join('')}
function status(){return `<div class="status"><span>9:41</span><div class="status-icons"><svg viewBox="0 0 18 16"><path d="M2 13v-2M6 13V8M10 13V5M14 13V2" stroke-width="2"/></svg><svg viewBox="0 0 18 16"><path d="M2 6a11 11 0 0114 0M5 9a6 6 0 018 0M8 12h2" stroke-width="1.6"/></svg><svg class="battery" viewBox="0 0 24 12"><rect x="1" y="1" width="19" height="10" rx="2"/><path d="M23 4v4"/><rect x="3" y="3" width="15" height="6" rx=".5" fill="currentColor" stroke="none"/></svg></div></div>`}
function displayLanguage(){return LANGUAGES.find(l=>l[0]===(screen==='review'?currentNote.language:language))[1]}
function metadata(){if(screen==='library')return '<div class="metadata"><span class="draft-tag">Draft</span></div>';let label=screen==='library'?'Draft':screen==='recording'?(paused?'Paused':'Recording'):currentNote.date;return `<div class="metadata"><span class="draft-tag">${label}</span><span class="sep"></span>${screen==='library'?`<button class="language-button" data-action="language" aria-label="Speech language: ${displayLanguage()}">${displayLanguage()}${icon('chevron')}</button>`:`<span>${displayLanguage()}</span>`}${screen==='review'?`<span class="sep"></span><span>${currentNote.duration}</span><button class="edit-document-button" data-action="edit-document">${icon(editMode?'check':'edit')}${editMode?'Done':'Edit'}</button>`:''}</div>`}
function body(){if(screen==='library')return `<div class="document-body empty-body"><div class="passage"><div class="margin-rule"><i class="margin-marker"></i></div><div><p class="empty-placeholder">Start speaking.<br>A document will follow.</p><div class="empty-label">Record in your own words.<br>Review the text when you’re ready.</div></div></div></div>`;if(screen==='recording')return `<div class="document-body"><div class="passage"><div class="margin-rule"><i class="margin-marker"></i></div><p class="passage-text">Keep the first version focused on capture, review and sharing.<span class="cursor"></span></p></div></div>`;if(editMode)return `<div class="document-body editing-body"><textarea class="document-editor" aria-label="Edit whole document" id="document-editor" spellcheck="false">${escapeHtml(documentText)}</textarea></div>`;return `<div class="document-body">${documentText.split(/\n\n|(?<=sharing\.) /).map(text=>`<div class="passage"><div class="margin-rule">${text.includes(phrase)?'<i class="margin-marker"></i>':''}</div><p class="passage-text">${escapeHtml(text).replace(escapeHtml(phrase),`<button class="uncertain" data-action="phrase" aria-label="Review phrase: ${escapeAttr(phrase)}">${escapeHtml(phrase)}</button>`)}</p></div>`).join('')}</div>`}
function footer(){if(screen==='library')return `<div class="capture-footer"><div class="capture-top"><button data-action="language">Speech language: <strong style="font-weight:500;color:#32362e">${LANGUAGES.find(l=>l[0]===language)[1]}</strong>${icon('chevron')}</button><span class="local-label">${icon('lock')}On device</span></div><button class="record-button" data-action="record">${icon('mic')}<span class="button-text">Record</span><span class="record-format">AUDIO + TEXT</span></button><p class="retention">Original audio stays with your document.</p></div>`;if(screen==='recording')return `<div class="recording-footer ${paused?'paused':''}"><div class="recording-signal"><span class="elapsed" id="elapsed">${time(seconds)}</span><div class="wave" aria-hidden="true">${waveform(36)}</div></div><div class="capture-controls"><button class="pause-button" data-action="pause" aria-label="${paused?'Resume':'Pause'} recording" title="${paused?'Resume':'Pause'}">${icon(paused?'play':'pause')}</button><button class="finish-button" data-action="finish">${icon('stop')}Finish</button></div><div class="record-status"><span><i class="live-dot"></i>${paused?'Demo paused':'Simulated capture'}</span><span>${icon('lock')}Audio stays on device</span></div></div>`;return `<div class="review-footer"><div class="audio-inspector"><div class="audio-title"><span>Original audio <span style="color:#a7aaa1">· demo</span></span><span class="audio-state">${icon('lock')}Kept with this document</span></div><div class="audio-player"><button class="play-button ${playing?'playing':''}" data-action="play" aria-label="${playing?'Pause original audio':'Play original audio'}">${icon(playing?'pause':'play')}</button><div class="wave" aria-hidden="true">${waveform(43)}</div><span class="audio-duration">${playing?'0:01':currentNote.duration}</span></div></div>${editMode?'<p class="editing-note">Editing text · original audio is unchanged</p>':documentText.includes(phrase)?`<button class="review-hint" data-action="phrase"><span class="hint-left">${icon(phraseEdited?'check':'flag')}${phraseEdited?'Phrase reviewed':'One phrase to check'}</span>${icon('arrow','arrow')}</button>`:'<p class="editing-note">Text updated · original audio is unchanged</p>'}<button class="copy-button" data-action="copy">${icon('copy')}Copy text</button><div class="screen-stamp">Editable text. Original audio preserved.</div></div>`}
function render(){const title=screen==='review'?currentNote.title:'Untitled';$('#app').innerHTML=`${status()}<header class="topbar"><span class="wordmark">focal</span><button class="documents-button" data-action="documents">${icon('docs')}Documents<span class="count">${String(NOTES.length).padStart(2,'0')}</span></button></header><main class="workspace"><div class="document-head"><div class="eyebrow">${screen==='recording'?`<i class="live-dot"></i>LIVE DOCUMENT`:screen==='review'?'VOICE DOCUMENT':'MONDAY, 2 NOVEMBER'}</div><h1>${escapeHtml(title)}</h1>${metadata()}</div>${body()}${footer()}</main><div class="homebar"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>${drawer?renderDrawer():''}${modal?renderModal():''}`;bind()}
function renderDrawer(){return `<section class="overlay" aria-label="Documents"><div class="overlay-nav"><button data-action="close-drawer">${icon('back')}Back to document</button><span class="count">ON DEVICE</span></div><div class="drawer-header"><h2>Documents</h2><p>Your words, with their original audio.</p></div><div class="note-list">${NOTES.map((n,i)=>`<button class="note-row" data-action="open-note" data-index="${i}"><span class="note-index">0${i+1}</span><span><span class="note-title">${n.title}</span><span class="note-meta">${n.date} · ${LANGUAGES.find(l=>l[0]===n.language)[1]}</span></span><span class="note-time">${n.duration}</span></button>`).join('')}</div><div class="drawer-bottom"><button class="new-document" data-action="new">${icon('plus')}New document</button><p>No accounts. Everything stays on this device.</p></div></section>`}
function renderModal(){let inner='';if(modal==='language'){inner=`<div class="sheet-heading"><h2>Speech language</h2><button class="close-button" data-action="close-modal" aria-label="Close language chooser">${icon('close')}</button></div><p class="sheet-subtitle">Choose the language you’ll speak.</p>${LANGUAGES.map(([code,name])=>`<button class="language-row" data-action="set-language" data-language="${code}"><span class="lang-code">${code}</span><span>${name}</span>${language===code?icon('check','check'):''}</button>`).join('')}`}else if(modal==='phrase'){inner=`<div class="sheet-heading"><h2>Check these words</h2><button class="close-button" data-action="close-modal" aria-label="Close phrase review">${icon('close')}</button></div><p class="sheet-subtitle">Listen, then make a correction if you need to.</p><blockquote class="phrase-quote">“${escapeHtml(phrase)}”</blockquote><div class="phrase-position">AUDIO EXCERPT · 01:26–01:28</div><div class="phrase-actions"><button class="dark" data-action="listen-phrase">${icon(playing?'pause':'play')}<span>${playing?'Pause excerpt':'Listen to phrase'}</span></button><button data-action="edit">${icon('edit')}Edit words</button></div><p class="edit-footnote">Your original recording is always preserved.</p>`}else{inner=`<div class="sheet-heading"><h2>Edit words</h2><button class="close-button" data-action="close-modal" aria-label="Close phrase editor">${icon('close')}</button></div><p class="sheet-subtitle">Make the text match what you meant.</p><textarea class="edit-field" id="phrase-input" aria-label="Phrase text">${escapeHtml(phrase)}</textarea><div class="phrase-actions"><button data-action="phrase">Cancel</button><button class="dark" data-action="save-phrase">${icon('check')}Save correction</button></div><p class="edit-footnote">This changes the text only. Original audio is preserved.</p>`}return `<div class="scrim" data-action="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="${modal==='language'?'Speech language':modal==='edit'?'Edit words':'Phrase review'}"><div class="sheet-handle"></div>${inner}</section></div>`}
function bind(){const editor=$('#document-editor');if(editor){editor.addEventListener('input',()=>{documentText=editor.value;currentNote.text=documentText})}document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',event=>{if(el.dataset.action==='scrim'&&event.target!==el)return;action(el.dataset.action,el)}));if(modal==='edit')setTimeout(()=>$('#phrase-input')?.focus(),80)}
function navigate(next){screen=next;const url=new URL(location.href);url.searchParams.set('screen',next);history.replaceState({},'',url);render()}
function stopAudio(){if(audio){audio.pause();audio.currentTime=0}playing=false}
function action(name,el){switch(name){case'documents':if(screen==='recording'){toast('Finish this recording before opening Documents.');break}drawer=true;modal=null;render();break;case'close-drawer':drawer=false;render();break;case'new':stopAudio();drawer=false;modal=null;paused=false;editMode=false;phrase='screen is off';phraseEdited=false;documentText=FULL_TEXT;navigate('library');break;case'record':seconds=12;paused=false;stopAudio();navigate('recording');break;case'pause':paused=!paused;render();break;case'finish':paused=false;editMode=false;documentText=FULL_TEXT;currentNote={id:Date.now(),title:'Untitled',date:'Today',duration:time(seconds),language,text:documentText};NOTES.unshift(currentNote);navigate('review');break;case'open-note':currentNote=NOTES[Number(el.dataset.index)];drawer=false;editMode=false;phrase=currentNote.phrase||'screen is off';phraseEdited=currentNote.phraseEdited||false;documentText=currentNote.text||FULL_TEXT;stopAudio();navigate('review');break;case'language':if(screen!=='library')break;modal='language';render();break;case'set-language':language=el.dataset.language;modal=null;render();break;case'close-modal':modal=null;stopAudio();render();break;case'scrim':modal=null;stopAudio();render();break;case'phrase':stopAudio();modal='phrase';render();break;case'edit-document':stopAudio();editMode=!editMode;render();if(editMode)$('#document-editor')?.focus();break;case'edit':stopAudio();modal='edit';render();break;case'save-phrase':{const next=$('#phrase-input').value.trim();if(!next){toast('Enter a phrase before saving.');return}documentText=documentText.replace(phrase,next);phrase=next;phraseEdited=true;currentNote.text=documentText;currentNote.phrase=phrase;currentNote.phraseEdited=true;modal=null;render();break}case'play':playAudio(false);break;case'listen-phrase':playAudio(true);break;case'copy':copyText();break}}
function time(n){return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function escapeAttr(s){return escapeHtml(s).replace(/"/g,'&quot;')}
function toast(message){const target=$('#toast');if(!target)return;target.textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{const t=$('#toast');if(t)t.textContent=''},3800)}
function playAudio(excerpt){if(playing){stopAudio();render();return}audio=new Audio(excerpt?AUDIO_PHRASE:AUDIO_FULL);playing=true;render();audio.onended=()=>{playing=false;render()};audio.onerror=()=>{playing=false;render();toast('Audio preview is unavailable in this browser.')};audio.play().then(()=>toast('Synthetic audio preview.')).catch(()=>{playing=false;render();toast('Audio playback is unavailable in this browser.')})}
async function copyText(){const text=documentText;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text)}else{const field=document.createElement('textarea');field.value=text;field.style.cssText='position:fixed;opacity:0';document.body.appendChild(field);field.select();const ok=document.execCommand('copy');field.remove();if(!ok)throw Error('unavailable')}toast('Text copied.')}catch(e){toast('Clipboard access is unavailable in this browser. Open this prototype in a full browser to copy.')}}
setInterval(()=>{if(screen==='recording'&&!paused){seconds++;const elapsed=$('#elapsed');if(elapsed)elapsed.textContent=time(seconds)}},1000);document.addEventListener('keydown',e=>{if(e.key==='Escape'){modal=null;drawer=false;stopAudio();render()}});render();
</script>
