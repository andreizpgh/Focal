name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android tooling
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Fetch and verify offline model
        run: python3 scripts/fetch-model.py
      - name: Recognize a real speech fixture
        run: bash scripts/smoke-stt.sh
      - name: Test, lint, and build
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Focal-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/assets/model-provenance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
            build/jfk.txt
