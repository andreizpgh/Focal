name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fast checks without the 670 MB speech model: debug builds, unit tests, lint, the device-test APK
  # and R8 shrinking of the release code all work without it. Device tests run locally
  # (./gradlew :app:connectedDebugAndroidTest) until an emulator job returns.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Test the model fetch script
        run: python3 -m unittest discover -s scripts/tests
      - name: Fetch and verify the speech runtime
        run: python3 scripts/fetch-model.py --runtime-only
      - name: Test, lint, and build
        run: >-
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          :app:assembleDebugAndroidTest :app:minifyReleaseWithR8 --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
