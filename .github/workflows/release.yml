name: Publish alpha
# TODO(release rework): publishing is disabled during the single-engine rebuild. The previous flow
# promoted a CI-built debug APK that bundled the Whisper model (scripts/publish-alpha.py, removed).
# CI now builds without the speech model, so a release workflow must build the verified release APK
# with scripts/fetch-model.py, sign it outside Git and attach its provenance before it returns.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publishing is disabled
        run: |
          echo "::error::Publishing is disabled until the release workflow is rebuilt for the single-engine app."
          exit 1
